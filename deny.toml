# cargo-deny configuration (ARCHITECTURE §6.1): licenses, advisories, sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "0BSD",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicates are reported but not fatal: large dependency trees (gix, gpui)
# legitimately pull several versions of a few crates.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
