[package]
name = "archipel-ui"
description = "Archipel desktop frontend (GPUI). The only crate depending on the UI toolkit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "archipel"
path = "src/main.rs"

[dependencies]
archipel-app.workspace = true
archipel-compose.workspace = true
archipel-graph.workspace = true
archipel-model.workspace = true
archipel-ops.workspace = true
archipel-theme.workspace = true
gpui-kit = { version = "0.9.0", features = ["syntect"] }
# The decoders gpui-kit already builds, for the image viewer's own decoding
# (sizes, pixel differences).
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
# The Markdown parser gpui-kit's text view already builds, to find the images
# a Markdown file shows and the headings its links point to.
markdown = "1.0.0"
memory-stats = "1"
# Mermaid diagrams in Markdown files, drawn to SVG without a browser.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
serde_json.workspace = true
# Same versions and features as gpui-kit's own highlighter, so both share one
# build and one syntax set.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# The jump list API takes its entries as GPUI's own `SmallVec`s.
smallvec = "1"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
archipel-model = { workspace = true, features = ["testing"] }
gpui-kit = { version = "0.9.0", features = ["test-support"] }
tempfile.workspace = true

# The render tests take the text system on its own: building the whole macOS
# platform for it requires the main thread, which test threads are not.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.11", features = ["font-kit"] }

[lints]
workspace = true
