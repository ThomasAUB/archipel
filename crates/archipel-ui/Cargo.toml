[package]
name = "archipel-ui"
description = "Archipel desktop frontend (GPUI). The only crate depending on the UI toolkit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "archipel"
path = "src/main.rs"

[dependencies]
archipel-app.workspace = true
archipel-compose.workspace = true
archipel-graph.workspace = true
archipel-model.workspace = true
archipel-ops.workspace = true
archipel-theme.workspace = true
gpui-kit = "0.9.0"
memory-stats = "1"
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
