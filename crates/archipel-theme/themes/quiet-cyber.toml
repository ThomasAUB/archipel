# Quiet Cyber: matte charcoal, desaturated teal / mauve / amber.
# Every token is set explicitly so the theme matches the mockups exactly;
# delete a line to fall back to the color derived from [base].
name = "Quiet Cyber"
extends = "dark"
radius = 0.0

[base]
background = "#0f1114"
text = "#dcdfe4"
accent = "#88bcc1"

[typography]
ui_font = "Jura"
mono_font = "Hack"
weight = 500.0
size = 14
line_height = 1.5

[tokens]
# Surfaces
"bg.app" = "#0f1114"
"bg.panel" = "#161920"
"bg.elevated" = "#1e2229"
"bg.input" = "#0b0d10"
"bg.hover" = "#232831"
"bg.selected" = "#1f3237"

# Text
"fg.default" = "#dcdfe4"
"fg.muted" = "#c2c8d0"
"fg.subtle" = "#adb4be"
"fg.disabled" = "#7e858f"

# Accent
"accent" = "#88bcc1"
"accent.hover" = "#9ecdd1"
"accent.fg" = "#0f1114"
"accent.subtle" = "#1e3337"

# Borders
"border.default" = "#30353f"
"border.subtle" = "#23272e"
"border.focus" = "#7cb2b7"

# Status
"status.dirty" = "#d4b075"
"status.ahead" = "#88bcc1"
"status.behind" = "#c697b6"
"status.conflict" = "#d69a75"
"status.success" = "#99c4a4"
"status.error" = "#d6878d"
"status.warning" = "#d6a175"

# Diff
"diff.add.bg" = "#1a3326"
"diff.del.bg" = "#3a1d23"
"diff.add.word.bg" = "#2a5a40"
"diff.del.word.bg" = "#6a2d38"
"diff.add.fg" = "#a9d1b3"
"diff.del.fg" = "#e2a3a8"

# Graph lanes: ordered so neighbours contrast (alternating hue families)
"graph.lane.0" = "#88bcc1"
"graph.lane.1" = "#c17b9f"
"graph.lane.2" = "#70b18f"
"graph.lane.3" = "#bd91bf"
"graph.lane.4" = "#a5b56f"
"graph.lane.5" = "#81a6d2"
"graph.lane.6" = "#caa66b"
"graph.lane.7" = "#9690c4"
"graph.lane.8" = "#8fc1a0"
"graph.lane.9" = "#cd836b"

# Syntax
"syntax.keyword" = "#c697b6"
"syntax.string" = "#d4b075"
"syntax.comment" = "#adb4be"
"syntax.function" = "#a9c3d6"
"syntax.type" = "#88bcc1"
"syntax.number" = "#a69fcb"
"syntax.constant" = "#a69fcb"
"syntax.operator" = "#cad0d8"
