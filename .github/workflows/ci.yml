name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            pkg-config mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dependency directions
        run: cargo xtask check-deps
      - name: Theme tokens only in the UI
        run: cargo xtask check-colors
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            pkg-config mesa-vulkan-drivers
      - name: Tests with coverage
        run: |
          cargo llvm-cov --workspace --exclude xtask --exclude archipel-fixtures \
            --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
      # Badge SVG rendered at publish time and pushed to the `badges` branch: the
      # repo is private, so shields.io cannot read it, but github.com serves it
      # to signed-in viewers of the README.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pct=$(jq '.data[0].totals.lines.percent' coverage.json)
          color=$(awk -v p="$pct" 'BEGIN { print (p >= 80 ? "brightgreen" : p >= 60 ? "yellow" : "red") }')
          mkdir badges && cd badges
          msg=$(LC_ALL=C printf '%.1f%%25' "$pct")
          curl -fsSL -o coverage.svg "https://img.shields.io/badge/coverage-${msg}-${color}"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -qm "Coverage badge for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench:
    name: Performance and memory budgets (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Budgets (spec targets)
        run: cargo run --release -p archipel-cli -- bench --check > bench.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench.jsonl
