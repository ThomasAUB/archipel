name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            pkg-config mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dependency directions
        run: cargo xtask check-deps
      - name: Theme tokens only in the UI
        run: cargo xtask check-colors
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            pkg-config mesa-vulkan-drivers
      - name: Tests with coverage
        run: |
          cargo llvm-cov --workspace --exclude xtask --exclude archipel-fixtures \
            --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
      # Coveralls renders the README badge from the uploaded report. An
      # outage on their side (download, checksum, upload) only leaves the
      # badge stale; it does not fail the build. `fail-on-error` only covers
      # the upload itself, so the reporter download needs `continue-on-error`.
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: lcov.info
          fail-on-error: false

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench:
    name: Performance and memory budgets (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Budgets (spec targets)
        run: cargo run --release -p archipel-cli -- bench --check > bench.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench.jsonl
